<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomasz Gajda — Front-end Developer / UI Designer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="hero">

        <!-- diagonal split background -->
        <div class="bg-split">
            <div class="bg-light"></div>
            <div class="bg-dark"></div>
        </div>

        <!-- logo -->
        <div class="logo">
            <svg viewBox="0 0 48 48" width="34" height="34" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M14 8 L34 8 L24 20 Z" fill="#111" />
                <path d="M10 40 L20 28 L10 16" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"
                    stroke-linejoin="round" />
                <path d="M38 16 L28 28 L38 40" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
        </div>

        <!-- nav -->
        <nav class="nav">
            <a href="#about">About me</a>
            <a href="#skills">Skills</a>
            <a href="#portfolio">Portfolio</a>
            <a href="#contact" class="nav-cta">Contact me</a>

        <!-- mobile menu button -->
        <button class="menu-btn" id="menuBtn" aria-label="Open menu">

            <div class="photo-placeholder">
                <svg viewBox="0 0 200 260" width="100%" height="100%" preserveAspectRatio="xMidYMax slice">
                    <circle cx="100" cy="90" r="55" fill="#3a3a3a" />
                    <path d="M20 260 C20 170 55 150 100 150 C145 150 180 170 180 260 Z" fill="#3a3a3a" />

    </header>

    <script src="script.js"></script>
